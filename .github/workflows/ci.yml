name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres-test:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: nestuser
          POSTGRES_PASSWORD: nestpass
          POSTGRES_DB: nestdb
        options: >-
          --name postgres-test
          --health-cmd "pg_isready -U nestuser -d nestdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis-test:
        image: redis/redis-stack:latest
        ports:
          - 6379:6379
        options: >-
          --name redis-test
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      APP_PORT: 3000

      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: nestuser
      DB_PASSWORD: nestpass
      DB_DB: nestdb

      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379

      # JWT – crie este secret no seu repositório GitHub
      JWT_TOKEN_SECRET: ${{ secrets.JWT_TOKEN_SECRET }}
      JWT_TOKEN_EXPIRESIN: 3600
      JWT_REFRESH_TOKEN_EXPIRESIN: 86400
      JWT_TOKEN_AUDIENCE: localhost:3000
      JWT_TOKEN_ISSUER: localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npx typeorm migration:run -d dist/src/db/data-source.js

      - name: Run tests & collect coverage
        run: npm run test:cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

