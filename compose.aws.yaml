services:
  nest-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest-app
    command: npm run start:prod
    ports:
      - "${APP_PORT}:${APP_PORT}"
    networks:
      - app-net
    env_file:
      - .env
    depends_on:
      - redis-stack

  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    volumes:
      - redis-stack-data:/data
    networks:
      - app-net
    env_file:
      - .env

volumes:
  redis-stack-data:

networks:
  app-net:
